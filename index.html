<!doctype html>
<html lang="pt-BR">
<head>

  <link rel="manifest" href="./manifest.webmanifest">

  <title>Pocahontas Â· Jogar</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#050a0c; color:#eef4f1; }
    * { box-sizing:border-box }
    html,body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; overscroll-behavior:none; }
    body { user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,a:focus-visible { outline:3px solid #d9ee9c; outline-offset:3px; }
    main { position:fixed; inset:0; width:100%; height:100dvh; display:grid; place-items:center; background:#000; }
    .stage { position:relative; width:100%; height:100%; display:grid; place-items:center; overflow:hidden; background:#000; }
    /* 640x480 Ã© o tamanho de incorporaÃ§Ã£o publicado pelo provedor.
       O emulador mantÃ©m proporÃ§Ãµes 4:3 em qualquer orientaÃ§Ã£o do iPad. */
    .game-frame { display:block; width:min(100vw, calc(100dvh * 4 / 3)); height:min(100dvh, calc(100vw * 3 / 4)); max-width:100%; border:0; background:#050b0d; overflow:hidden; touch-action:manipulation; }
    .top { position:fixed; z-index:10; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; top:max(10px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); right:max(12px,env(safe-area-inset-right)); opacity:0; pointer-events:none; transition:opacity .2s ease; }
    body.hud-visible .top, .top:focus-within { opacity:1; pointer-events:auto; }
    .brand { font-size:12px; font-weight:800; padding:10px 12px; border-radius:13px; background:#07120fe6; box-shadow:0 10px 26px #0008; }
    .brand span { color:#d9ee9c; }
    .actions { display:flex; align-items:center; gap:7px; }
    .button { font:600 12px system-ui,-apple-system,sans-serif; border-radius:13px; border:1px solid #d9ee9c5c; background:#07120fed; color:#f7fff9; min-height:41px; padding:0 12px; cursor:pointer; backdrop-filter:blur(12px); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    .button:active { transform:scale(.97); }
    .touch-menu { position:fixed; z-index:9; top:max(11px,env(safe-area-inset-top)); right:max(12px,env(safe-area-inset-right)); width:40px; height:40px; display:grid; place-items:center; border:1px solid #ffffff23; border-radius:13px; background:#03100eb5; color:#d6f19c; cursor:pointer; box-shadow:0 10px 26px #0006; transition:opacity .2s; }
    body.hud-visible .touch-menu { opacity:0; pointer-events:none; }
    .loading { position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:24px; background:#050a0c; text-align:center; transition:opacity .25s; }
    .loading.off { opacity:0; pointer-events:none; }
    .loading strong { display:block; font-size:clamp(21px,4vw,31px); letter-spacing:-.04em; }
    .loading p { font-size:13px; color:#bcc9c5; line-height:1.5; max-width:360px; }
    .spinner { width:35px; height:35px; border:3px solid #ffffff1a; border-top-color:#d9ee9c; border-radius:100%; margin:0 auto 20px; animation:spin .75s linear infinite; }
    .help { position:fixed; bottom:max(12px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:11; border-radius:12px; padding:9px 13px; font-size:11px; white-space:nowrap; background:#06120ded; border:1px solid #ffffff24; color:#d4dfda; box-shadow:0 8px 26px #0008; opacity:0; pointer-events:none; transition:opacity .2s; }
    body.hud-visible .help { opacity:1; }
    [hidden] { display:none !important; }
    .stage { padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .stage { container-type:size; }
    .game-frame { width:min(100cqw,calc(100cqh * 4 / 3)); height:auto; max-height:100%; aspect-ratio:4/3; }
    body.connection-lost .help { opacity:1; }
    .top { flex-wrap:wrap; }
    .actions { flex-wrap:wrap; }
    .help { white-space:normal; max-width:90vw; width:max-content; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(orientation:portrait) and (pointer:coarse) { body.hud-visible .help::after { content:' Â· Melhor na horizontal'; } }
    @media(prefers-reduced-motion:reduce) { .spinner { animation:none; } * { transition:none !important; } }
  </style>
</head>
<body>
  <main id="app">

    <div class="top" id="top" hidden>
      <div class="brand">POCAHONTAS <span>Â· MEGA DRIVE</span></div>
      <div class="actions">
        <button class="button" id="fullScreen" type="button" title="Solicitar tela cheia">â›¶ Tela cheia</button>
        <button class="button" id="reload" type="button" title="Recarregar jogo">â†» Reiniciar</button>
        <a class="button" href="https://arcader.com/pocahontas/" target="_blank" rel="noopener noreferrer" title="Abrir o jogo no site do provedor">Abrir origem</a>
        <button class="button" id="closeMenu" type="button" title="Continuar jogando">Continuar jogando</button>

  </main>
  <script src="./lifecycle.js" defer></script>

</html>
